<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* Header */
        .header {
            width: 100%;
            background: #1e1e1e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .header h2 {
            margin: 0;
            color: white;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            background: #007bff;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            right: 30px;
        }
        .profile-pic2 {
            width: 40px;
            height: 40px;
            background: #007bff;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            
        }

        .chat-container {
            
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2px;
            width: 100%;
            
        }

        .messages {
            width: 90%;
            max-width: 600px;
            height: 570px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 10px;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
        }

        .message {
            display: flex;
            align-items: center;
            margin: 10px 0;
            max-width: 80%;
        }

        .user-message {
            background: skyblue;
            color: black;
            padding: 10px;
            border-radius: 10px;
            align-self: flex-end;
            order: 1;
        }

        .ai-message {
            background: rgba(255, 0, 0, 0);
            color: white;
            padding: 10px;
            border-radius: 10px;
            align-self: flex-start;
            order: 1;
        }

        .user-container {
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            gap: 8px;
            align-self: flex-end;
        }

        .ai-container {
            display: flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
        }

        .input-container {
            width: 90%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        .btn {
            background: #007bff;
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #0056b3;
        }
        /* Profile Dropdown */
.profile-dropdown {
    display: none;
    position: absolute;
    top: 60px;
    right: 20px;
    background: #1e1e1e;
    border-radius: 10px;
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
    width: 150px;
    text-align: center;
    z-index: 1000;
}

.dropdown-item {
    display: block;
    padding: 12px;
    border: none;
    background: none;
    color: white;
    width: 100%;
    text-align: left;
    cursor: pointer;
    font-size: 14px;
}

.dropdown-item:hover {
    background: #333;
}

.logout {
    color: red;
}

    </style>
</head>
<body>

    <!-- Header with AI Chatbot Title & Profile Picture -->
    <div class="header">
        <h2>AI Chatbot</h2>
        <!-- Profile Picture in Header -->
<div class="profile-pic" id="profilePic">?</div>

<!-- Dropdown Menu -->
<div class="profile-dropdown" id="profileDropdown">
    <button class="dropdown-item" onclick="viewProfile()">👤 Profile View</button>
    <button class="dropdown-item logout" onclick="logoutUser()">🚪 Logout</button>
</div>

    </div>

    <div class="chat-container">
        <div class="messages" id="chat"></div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Type a message...">
            <button class="btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script type="module">
       import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCKTRaRL0MqU3fHFVcIWvebqciNr7Ow3No",
    authDomain: "aichat-155f7.firebaseapp.com",
    projectId: "aichat-155f7",
    storageBucket: "aichat-155f7.appspot.com",
    messagingSenderId: "570934429134",
    appId: "1:570934429134:web:494946fe8d133c1ebd579f"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let userProfile = "U";

onAuthStateChanged(auth, (user) => {
    if (user) {
        userProfile = user.email.charAt(0).toUpperCase();
        document.getElementById("profilePic").innerText = userProfile;
    } else {
        window.location.href = "index.html"; // Redirect to login
    }
});

const profilePic = document.getElementById("profilePic");
const dropdown = document.getElementById("profileDropdown");

profilePic.addEventListener("click", () => {
    dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
});

document.addEventListener("click", (event) => {
    if (!profilePic.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.style.display = "none";
    }
});

function viewProfile() {
    window.location.href = "profile.html";
}

function logoutUser() {
    signOut(auth).then(() => {
        alert("Logged out successfully!");
        window.location.href = "index.html";
    }).catch((error) => {
        console.error("Logout Error:", error);
    });
}

// Make functions globally accessible
window.viewProfile = viewProfile;
window.logoutUser = logoutUser;


        async function sendMessage() {
            let userMessage = document.getElementById("userInput").value;
            if (!userMessage.trim()) return;

            let chatBox = document.getElementById("chat");

            chatBox.innerHTML += `
                <div class="message user-message">${userMessage}</div>
            `;
            document.getElementById("userInput").value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            let typingIndicator = document.createElement("div");
            typingIndicator.className = "message ai-message";
            typingIndicator.innerHTML = "AI is typing...";
            chatBox.appendChild(typingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;

            await new Promise(resolve => setTimeout(resolve, 500));

            try {
                const response = await fetch("https://chatgpt-42.p.rapidapi.com/gpt4", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-RapidAPI-Key": "8855a7ba99msh6f5ab5ed9ffa17fp196266jsn50ed56cf4806",
                        "X-RapidAPI-Host": "chatgpt-42.p.rapidapi.com"
                    },
                    body: JSON.stringify({ messages: [{ role: "user", content: userMessage }] })
                });

                const data = await response.json();
                let aiMessage = data.result || "Sorry, I couldn't understand that.";

                chatBox.removeChild(typingIndicator);
                chatBox.innerHTML += `<div class="message ai-message">${aiMessage}</div>`;
            } catch (error) {
                console.error("Error fetching AI response:", error);
            }
        }

        window.sendMessage = sendMessage;
    </script>

</body>
</html>
