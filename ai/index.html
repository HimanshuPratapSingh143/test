<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            width: 300px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        input {
            width: 93.5%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .google-btn {
            background: #ffffff;
        }
        
        .google-btn:hover {
            background: #918f8d;
        }
        .link {
            color: #007bff;
            cursor: pointer;
            margin-top: 10px;
            display: block;
        }
        .ldl {
            position: relative;
            top:4px;
            right: 2px;
           
        }
        .google-btn {
    color: rgb(0, 0, 0);  /* Changes text color to red */
    
}

        .popup {
            display: none;
            position: fixed;
            top: 20px;
            right: 20px;
            background: red;
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            animation: fadeInOut 3s;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="container" id="login-container">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button class="btn" onclick="login()">Login</button>
        
        <button class="btn google-btn" onclick="googleLogin()">
            <img class="ldl" width="20" height="20" src="https://img.icons8.com/color/30/google-logo.png" alt="google-logo"/> Login with Google
        </button>
        
        <span class="link" onclick="showRegister()">Don't have an account? Register</span>
    </div>
    

    <div class="container" id="register-container" style="display:none;">
        <h2>Register</h2>
        <input type="email" id="register-email" placeholder="Email">
        <input type="password" id="register-password" placeholder="Password">
        <button class="btn" onclick="register()">Register</button>
        <button class="btn google-btn" onclick="googleLogin()">Register with Google</button>
        <span class="link" onclick="showLogin()">Already have an account? Login</span>
    </div>

    <div class="popup" id="error-popup"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            GoogleAuthProvider, 
            signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/11.5.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCKTRaRL0MqU3fHFVcIWvebqciNr7Ow3No",
            authDomain: "aichat-155f7.firebaseapp.com",
            projectId: "aichat-155f7",
            storageBucket: "aichat-155f7.appspot.com",
            messagingSenderId: "570934429134",
            appId: "1:570934429134:web:494946fe8d133c1ebd579f",
            measurementId: "G-YEZ213LM0C"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // Attach Firebase functions to window object
        window.firebaseAuth = auth;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInWithPopup = signInWithPopup;
        window.googleProvider = googleProvider;
    </script>

    <script>
        function showPopup(message) {
            const popup = document.getElementById("error-popup");
            popup.innerText = message;
            popup.style.display = "block";
            setTimeout(() => {
                popup.style.display = "none";
            }, 3000);
        }

        window.register = function () {
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            window.createUserWithEmailAndPassword(window.firebaseAuth, email, password)
                .then((userCredential) => {
                    showPopup("Registration Successful! Please login.");
                    showLogin();
                })
                .catch((error) => {
                    showPopup(error.message);
                });
        }

        window.login = function () {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            window.signInWithEmailAndPassword(window.firebaseAuth, email, password)
                .then((userCredential) => {
                    localStorage.setItem('user', JSON.stringify(userCredential.user));
                    window.location.href = 'chat.html';
                })
                .catch((error) => {
                    showPopup("User not registered. Please register.");
                });
        }

        window.googleLogin = function () {
            window.signInWithPopup(window.firebaseAuth, window.googleProvider)
                .then((result) => {
                    localStorage.setItem('user', JSON.stringify(result.user));
                    window.location.href = 'chat.html';
                })
                .catch((error) => {
                    showPopup("Google Login Failed: " + error.message);
                });
        }

        window.showRegister = function () {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('register-container').style.display = 'block';
        }
        
        window.showLogin = function () {
            document.getElementById('register-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
        }
    </script>

</body>
</html>
